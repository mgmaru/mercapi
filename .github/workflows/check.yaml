name: Tests

on:
  - push
  - pull_request

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
          cache: "poetry"

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install linting dependencies
        run: poetry install --only lint

      - name: Check Linting
        run: poetry run black --check mercapi/ tests/

  test:
    name: Unit test
    needs: lint
    # Not ubuntu-latest. That label moved to Ubuntu 26.04, for which there is
    # no Python 3.9 build, so the 3.9 job failed in setup-python before any
    # test ran and fail-fast cancelled the other four. 24.04 is the newest
    # image that has all five versions pyproject.toml declares.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: poetry install

      - name: Test with pytest
        # --record-mode=none is the default, but state it so a configuration
        # change can never turn a test run into live traffic against Mercari.
        run: poetry run pytest --record-mode=none
